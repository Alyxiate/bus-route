name: Install Boreal Android source

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'boreal-android-v5.1-native-repository.zip'

permissions:
  contents: write

jobs:
  install-source:
    if: github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Detect prepared source archive
        id: archive
        shell: bash
        env:
          ARCHIVE: boreal-android-v5.1-native-repository.zip
        run: |
          if [[ -f "$ARCHIVE" ]]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
            echo 'Prepared archive is already absent; no source installation is required.'
          fi

      - name: Verify and extract prepared source
        if: steps.archive.outputs.present == 'true'
        shell: bash
        env:
          ARCHIVE: boreal-android-v5.1-native-repository.zip
          EXPECTED_SHA256: b155d7435a33a3989215689bbeaeac2c5a6463facfd81f0e2edb6dfe89044d5b
        run: |
          set -euo pipefail
          printf '%s  %s\n' "$EXPECTED_SHA256" "$ARCHIVE" | sha256sum --check --strict
          python3 - "$ARCHIVE" <<'PY'
          import sys
          from pathlib import PurePosixPath
          from zipfile import BadZipFile, ZipFile

          try:
              with ZipFile(sys.argv[1]) as archive:
                  for member in archive.infolist():
                      path = PurePosixPath(member.filename.replace('\\', '/'))
                      if path.is_absolute() or '..' in path.parts:
                          raise SystemExit(f'Unsafe ZIP entry: {member.filename}')
          except BadZipFile as error:
              raise SystemExit(f'Invalid source ZIP: {error}') from error
          PY
          unzip -q -o "$ARCHIVE" -d .
          chmod +x gradlew

      - name: Commit extracted Android project
        if: steps.archive.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree .github
          rm boreal-android-v5.1-native-repository.zip
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m 'Install Boreal 5.1 Native Android source and automated builds'
          git push
