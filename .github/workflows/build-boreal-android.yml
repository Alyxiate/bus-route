name: Build Boreal Native Android

on:
  workflow_dispatch:
  push:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'settings.gradle.kts'
  pull_request:
    paths:
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - '**/*.java'
      - '**/*.kt'
      - '**/*.kts'
      - '**/*.xml'
      - 'gradle/**'
      - 'gradle.properties'
      - 'gradlew'
      - 'gradlew.bat'
      - 'settings.gradle'
      - 'settings.gradle.kts'

permissions:
  contents: read

concurrency:
  group: boreal-native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Test and assemble unsigned release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out Android source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK components
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --install \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0'

      - name: Set up Gradle caching
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run release unit tests
        run: ./gradlew --no-daemon :app:testReleaseUnitTest

      - name: Assemble unsigned release APK
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: Verify unsigned APK output
        shell: bash
        run: |
          set -euo pipefail
          apk='app/build/outputs/apk/release/app-release-unsigned.apk'
          if [[ ! -s "$apk" ]]; then
            echo "::error::Expected unsigned release APK was not created at $apk"
            find app/build/outputs/apk -maxdepth 4 -type f -print 2>/dev/null || true
            exit 1
          fi

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: Boreal-Native-Unsigned-APK
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

